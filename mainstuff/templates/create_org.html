<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Organization — LeadRank</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #4ade80;
      --text: #e8e8f0;
      --muted: #5a5a72;
      --error: #f87171;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(74,222,128,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(74,222,128,0.02) 1px, transparent 1px); background-size: 48px 48px; pointer-events: none; z-index: 0; }
    .container { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 44px 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 34px; }
    h1 { font-family: 'Syne', sans-serif; font-size: 32px; margin-bottom: 10px; }
    p { color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 18px; border: none; border-radius: 10px; background: var(--accent); color: #0a0a0f; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn-outlined { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .button-row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .error-msg { background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--error); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Create your organization</h1>
      <p>Before you can submit leads, we need a business record for your account.</p>
      <form method="POST" action="/create-org">
        <div class="field">
          <label for="business_name">Business Name</label>
          <input id="business_name" name="business_name" type="text" placeholder="e.g. Joe's HVAC" required />
        </div>
        <div class="button-row">
          <button class="btn" type="submit">Create organization</button>
          <a class="btn btn-outlined" href="/logout">Logout</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
