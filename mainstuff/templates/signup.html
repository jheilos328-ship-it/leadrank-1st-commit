<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — LeadRank</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --border:    #1e1e2e;
      --accent:    #4ade80;
      --accent2:   #22d3ee;
      --text:      #e8e8f0;
      --muted:     #5a5a72;
      --error:     #f87171;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridDrift 20s linear infinite;
      pointer-events: none;
    }

    @keyframes gridDrift {
      0%   { transform: translateY(0); }
      100% { transform: translateY(48px); }
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
      animation: blobFloat 8s ease-in-out infinite alternate;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: var(--accent);
      top: -150px; left: -150px;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: var(--accent2);
      bottom: -100px; right: -100px;
      animation-delay: -4s;
    }

    @keyframes blobFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.08); }
    }

    .layout {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
      animation: fadeUp 0.5s 0.1s both;
    }

    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .brand-name span { color: var(--accent); }

    .heading {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 6px;
      animation: fadeUp 0.5s 0.15s both;
    }

    .subheading {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
      animation: fadeUp 0.5s 0.2s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0 20px;
      animation: fadeUp 0.5s 0.28s both;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 18px;
      animation: fadeUp 0.5s both;
    }
    .form-group:nth-child(1) { animation-delay: 0.25s; }
    .form-group:nth-child(2) { animation-delay: 0.28s; }
    .form-group:nth-child(3) { animation-delay: 0.31s; }
    .form-group:nth-child(4) { animation-delay: 0.34s; }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: var(--muted); }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.08);
    }

    /* Password strength hint */
    .input-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .error-msg {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
      margin-bottom: 20px;
      animation: fadeUp 0.3s both;
    }

    .info-msg {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #d9f99d;
      margin-bottom: 20px;
      animation: fadeUp 0.3s both;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
      margin-top: 8px;
      animation: fadeUp 0.5s 0.38s both;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(74, 222, 128, 0.25);
    }

    .btn:hover::after { opacity: 1; }
    .btn:active { transform: translateY(0); }

    /* Terms note */
    .terms-note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 16px;
      line-height: 1.6;
      animation: fadeUp 0.5s 0.42s both;
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
      animation: fadeUp 0.5s 0.45s both;
    }

    .footer-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .footer-link a:hover { opacity: 0.75; }

    .corner-tag {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 10px;
      color: var(--border);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="layout">
    <div class="card">

      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-name">Lead<span>Rank</span></div>
      </div>

      <h1 class="heading">Create your account</h1>
      <p class="subheading">Start prioritizing leads in minutes</p>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}
      {% if message %}
      <div class="info-msg">{{ message }}</div>
      {% endif %}

      <form method="POST" action="/signup">

        <div class="form-group">
          <label for="business_name">Business Name</label>
          <input
            type="text"
            id="business_name"
            name="business_name"
            placeholder="Joe's HVAC Services"
            required
          />
        </div>

        <div class="divider">
          <div class="divider-line"></div>
          <div class="divider-label">Account</div>
          <div class="divider-line"></div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@yourbusiness.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            minlength="6"
            required
          />
          <div class="input-hint">Minimum 6 characters</div>
        </div>

        <button type="submit" class="btn">Create account →</button>

      </form>

      <div class="terms-note">
        By signing up you agree to use this responsibly.<br/>
        No spam. No nonsense.
      </div>

      <div class="footer-link">
        Already have an account? <a href="/login">Sign in</a>
      </div>

      <div class="corner-tag">v2.0</div>

    </div>
  </div>

</body>
</html>
